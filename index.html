<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山坡与雪山</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <div id="app"></div>
  <div class="vignette"></div>
  <header class="hud">
    <p class="eyebrow">A QUIET HILLSIDE</p>
    <h1>山坡与雪山</h1>
  </header>
  <div id="prompt" class="prompt"></div>
  <div id="reel" class="reel"><i class="reel-fill"></i><i class="reel-band"></i><i class="reel-tension"></i></div>
  <div id="sleep-overlay" class="sleep-overlay"><span></span></div>
  <button id="help-trigger" class="help-trigger" type="button">玩法说明</button>
  <div id="help-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-card" tabindex="-1">
      <button class="modal-close" type="button" data-modal-close aria-label="关闭">×</button>
      <p class="modal-eyebrow">HOW TO PLAY</p>
      <h2 id="help-title">玩法说明</h2>
      <ul class="help-list">
        <li><b>移动</b>方向键 / WASD</li>
        <li><b>奔跑</b>Shift（双击锁定疾奔）</li>
        <li><b>蹲下</b>Ctrl（再按站起）</li>
        <li><b>跳跃</b>空格</li>
        <li><b>交互</b>E（睡觉 / 坐下 / 出门 / 骑乘 / 鱼竿）</li>
        <li><b>下杆</b>R 选落点（移动鼠标选点），左键下杆（落杆后站定按 R 收杆）</li>
        <li><b>收线</b>咬钩后连点鼠标左键</li>
        <li><b>视角</b>拖拽旋转</li>
        <li><b>声音</b>M 开关（默认关闭）</li>
        <li><b>关闭弹窗</b>点击 × 或按 Esc</li>
      </ul>
    </div>
  </div>
  <div class="loader" id="loader"><span>正在生成场景...</span></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
